<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市舶司 | 昨日晚报</title>
    <link href="newspaper.css?v=3" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
    <script src="../../js/userAccount.js" defer></script>
    <style>
        :root {
            --gs-bg: #ffffff;
            --gs-text: #111111;
            --gs-text-sub: #333333;
            --gs-border: #ddd;
            --gs-card: #fff;
            --gs-main: #007aff;
            --gs-success: #00B42A;
            --gs-danger: #F53F3F;
            --gs-warning: #FFC107;
            --gs-hint: #999;
            --gs-block: #F2F2F2;
            --gs-trbg: rgba(255, 255, 255, 0.247);
        }
        body.theme-dark {
            --gs-bg: #121212;
            --gs-text: #ffffff;
            --gs-text-sub: #cccccc;
            --gs-border: #333;
            --gs-card: #1e1e1e;
            --gs-block: #2a2a2a;
            --gs-hint: #666;
        }

        .masthead-kicker {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 14px 0;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--np-color-rule, #2c2c2c);
            border-top: 3px double var(--np-color-rule, #2c2c2c);
            padding-top: 10px;
        }

        .masthead-kicker .kicker {
            display: block;
            font-family: var(--np-font-serif, Georgia, serif);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--np-color-accent, #8b0000);
            padding-bottom: 4px;
            border-bottom: 2px solid var(--np-color-accent, #8b0000);
            width: fit-content;
            font-variant: small-caps;
            margin-bottom: 0;
        }

        .masthead-volume {
            font-family: var(--np-font-serif, Georgia, serif);
            font-size: 12px;
            font-style: italic;
            color: var(--np-color-muted, #6b6b6b);
            letter-spacing: 1px;
        }

        .newspaper-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 32px;
            align-items: start;
        }

        .newspaper-content-area {
            min-width: 0;
        }

        .news-columns {
            column-count: 2;
            column-gap: 2rem;
            column-rule: 1px solid var(--np-color-rule, #2c2c2c);
        }

        .news-columns.news-columns-3 {
            column-count: 3;
        }

        .news-columns > * {
            break-inside: avoid;
        }

        .sidebar-stats-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sidebar-stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--np-color-rule, #2c2c2c);
            font-family: var(--np-font-serif, Georgia, serif);
            font-size: 13px;
        }

        .sidebar-stat-item:last-child {
            border-bottom: none;
        }

        .sidebar-stat-label {
            color: var(--np-color-muted, #6b6b6b);
            letter-spacing: 1px;
            font-variant: small-caps;
            text-transform: uppercase;
        }

        .sidebar-stat-value {
            font-weight: 700;
            color: var(--np-color-accent, #8b0000);
            font-family: var(--np-font-headline, Georgia, serif);
        }

        .sidebar-stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }

        .sidebar-stat-bar {
            display: flex;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            background: rgba(128,128,128,0.2);
            margin-bottom: 6px;
        }

        .sidebar-stat-bar .bar-left {
            background: #c62828;
            transition: width 0.3s;
        }

        .sidebar-stat-bar .bar-neutral {
            background: #757575;
            transition: width 0.3s;
        }

        .sidebar-stat-bar .bar-right {
            background: #1565c0;
            transition: width 0.3s;
        }

        .sidebar-stat-legend {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--np-color-muted, #6b6b6b);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-item i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-left { background: #c62828; }
        .dot-neutral { background: #757575; }
        .dot-right { background: #1565c0; }

        .sidebar-stat-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .sidebar-stat-icon {
            font-size: 14px;
        }

        .sidebar-stat-actions {
            margin-top: 8px;
        }

        .sidebar-btn {
            width: 100%;
            padding: 8px 12px;
            background: var(--np-color-accent, #8b0000);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: var(--np-font-serif, Georgia, serif);
            transition: opacity 0.2s;
        }

        .sidebar-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 900px) {
            .newspaper-layout {
                grid-template-columns: 1fr;
            }

            .news-columns,
            .news-columns.news-columns-3 {
                column-count: 1;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/" style="text-decoration:none;color:inherit;">市舶司</a>
        </div>
        <button class="navbar-toggle" id="navbar-toggle" onclick="toggleNavbar()" aria-label="切换导航菜单">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="navbar-nav" id="navbar-nav">
            <li>
                <button onclick="fetchNews()" id="fetchBtn">抓取新闻</button>
            </li>
            <li>
                <button onclick="toggleFavoritesPanel()" class="favorite-nav-btn">
                    <span class="favorite-icon">♥</span> 收藏
                    <span class="favorite-badge" id="favoriteCount">0</span>
                </button>
            </li>
            <li>
                <button onclick="openSettings()">设置</button>
            </li>
            <li>
                <button onclick="openExport()">导出</button>
            </li>
            <li>
                <button onclick="window.location.href='/admin'">📊 运维</button>
            </li>
            <li>
                <button onclick="toggleTheme()">🌓 主题</button>
            </li>
            <li>
                <span id="searchEngineStatus" class="se-status offline" title="SearchEngine 状态"></span>
            </li>
            <li id="userAccountSlot" style="display:flex;align-items:center;justify-content:flex-end;order:999;"></li>
        </ul>
    </nav>

    <div class="newspaper-container">
        <header class="newspaper-header">
            <div class="masthead-kicker">
                <span class="kicker">创刊于二〇二四年 · 晚报号外</span>
                <span class="masthead-volume">Vol. I · No. 125 · 华夏版</span>
            </div>
            <div class="header-top">
                <div class="header-date" id="currentDate"></div>
                <div class="header-title">
                    <h1>昨日晚报</h1>
                    <span class="header-subtitle">THE EVENING NEWS</span>
                </div>
                <div class="header-weather" id="headerWeather"></div>
            </div>
            <div class="header-bar">
                <span class="bar-item">第 <span id="issueNumber">1</span> 期</span>
                <span class="bar-divider">|</span>
                <span class="bar-item">共 <span id="totalNews">0</span> 条新闻</span>
                <span class="bar-divider">|</span>
                <span class="bar-item">来源 <span id="totalSources">0</span> 个</span>
                <span class="bar-divider">|</span>
                <span class="bar-item" id="lastUpdate">未更新</span>
            </div>
        </header>

        <div class="newspaper-controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索新闻或全网搜索...">
                <button onclick="searchNews()" title="本地搜索">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
                <button class="search-engine-btn" onclick="fallbackSearchEngine()" title="使用 SearchEngine 全网搜索">
                    🌐 全网
                </button>
            </div>

            <div class="filter-controls">
                <select id="categoryFilter" onchange="applyFilters()">
                    <option value="all">全部分类</option>
                </select>
                <input type="date" id="dateFrom" onchange="applyFilters()" title="开始日期">
                <input type="date" id="dateTo" onchange="applyFilters()" title="结束日期">
                <button class="btn-filter" onclick="resetFilters()">重置</button>
            </div>

            <div class="action-buttons">
                <button class="btn-primary" onclick="fetchNews()" id="fetchBtn2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    抓取
                </button>
                <button class="btn-secondary" onclick="openExport()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    导出
                </button>
            </div>
        </div>

        <div class="newspaper-layout">
            <div class="newspaper-content-area">
                <main class="newspaper-main" id="newspaperMain">
                    <div class="loading" id="loadingIndicator">
                        <div class="spinner"></div>
                        <p>加载新闻中...</p>
                    </div>
                </main>

                <div class="pagination" id="pagination"></div>
            </div>

            <aside class="news-sidebar">
                <h3 class="news-sidebar-title">分析统计</h3>
                <div class="news-sidebar-content">
                    <div class="sidebar-stats-list" id="sidebarStats">
                        <p style="color:var(--np-color-muted);font-style:italic;font-size:13px;">加载中...</p>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h3 class="news-sidebar-title">收藏管理</h3>
                    <div class="sidebar-favorites-actions">
                        <button class="sidebar-btn" onclick="toggleFavoritesPanel()">
                            ♥ 查看收藏 (<span id="sidebarFavCount">0</span>)
                        </button>
                        <button class="sidebar-btn danger" onclick="clearAllFavorites()">
                            🗑 清空收藏
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="news-sidebar-title">数据保存</h3>
                    <div class="sidebar-se-status">
                        <p style="font-size:13px;">⭐ 永久保存：<strong id="permanentCount">0</strong> 条</p>
                        <p class="se-desc">标记为永久保存的新闻不会被自动清理</p>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="news-sidebar-title">SearchEngine</h3>
                    <div class="sidebar-se-status">
                        <div id="seStatusIndicator" class="se-indicator offline">
                            <span class="se-dot"></span>
                            <span id="seStatusText">检测中...</span>
                        </div>
                        <p class="se-desc" id="seStatusDesc">全网搜索辅助服务</p>
                    </div>
                </div>
            </aside>

            <div class="favorites-panel-overlay" id="favoritesOverlay" onclick="toggleFavoritesPanel()"></div>
            <div class="favorites-panel" id="favoritesPanel">
                <div class="favorites-panel-header">
                    <h2>♥ 我的收藏 <span class="fav-count-badge" id="favCountBadge">0</span></h2>
                    <div class="favorites-panel-actions">
                        <button class="btn-sm btn-danger" onclick="clearAllFavorites()">清空</button>
                        <button class="btn-sm" onclick="toggleFavoritesPanel()">关闭</button>
                    </div>
                </div>
                <div class="favorites-list" id="favoritesList">
                    <p style="color:var(--np-color-muted);padding:20px;">加载中...</p>
                </div>
            </div>
        </div>

        <footer class="newspaper-footer">
            <p>© 市舶司 · 昨日晚报 - 新闻自动聚合服务</p>
            <p class="footer-sub">所有新闻内容均来自公开RSS源，版权归原作者所有</p>
        </footer>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新闻源管理</h3>
                <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="tabs-browser">
                    <button class="tab-browser active" onclick="switchSettingsTab('sources', this)">新闻源</button>
                    <button class="tab-browser" onclick="switchSettingsTab('add', this)">添加源</button>
                    <button class="tab-browser" onclick="switchSettingsTab('stats', this)">统计</button>
                </div>
                <div class="tabs-content">
                    <div class="tab-pane active" id="sources-tab">
                        <div class="sources-list" id="sourcesList">
                            <p class="loading">加载中...</p>
                        </div>
                    </div>
                    <div class="tab-pane" id="add-tab">
                        <div class="form-group">
                            <label>源名称</label>
                            <input type="text" id="srcName" placeholder="例如：人民网-时政">
                        </div>
                        <div class="form-group">
                            <label>RSS/Atom URL</label>
                            <input type="url" id="srcUrl" placeholder="https://example.com/rss.xml">
                        </div>
                        <div class="form-group">
                            <label>类型</label>
                            <select id="srcType">
                                <option value="rss">RSS</option>
                                <option value="atom">Atom</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>分类</label>
                            <select id="srcCategory">
                                <option value="综合">综合</option>
                                <option value="时政">时政</option>
                                <option value="财经">财经</option>
                                <option value="科技">科技</option>
                                <option value="体育">体育</option>
                                <option value="社会">社会</option>
                                <option value="国际">国际</option>
                                <option value="军事">军事</option>
                                <option value="教育">教育</option>
                                <option value="健康">健康</option>
                                <option value="娱乐">娱乐</option>
                                <option value="汽车">汽车</option>
                                <option value="房产">房产</option>
                            </select>
                        </div>
                        <button class="btn-primary" onclick="addSource()">添加新闻源</button>
                    </div>
                    <div class="tab-pane" id="stats-tab">
                        <div class="stats-grid" id="statsGrid">
                            <p class="loading">加载中...</p>
                        </div>
                        <div class="stats-actions">
                            <button class="btn-danger" onclick="cleanOldNews(7)">清理7天前</button>
                            <button class="btn-danger" onclick="cleanOldNews(30)">清理30天前</button>
                            <button class="btn-danger" onclick="cleanOldNews(90)">清理90天前</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>导出晚报</h3>
                <button class="modal-close" onclick="closeModal('exportModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>导出格式</label>
                    <div class="format-options">
                        <label class="format-option">
                            <input type="radio" name="exportFormat" value="md" checked>
                            <div class="format-card">
                                <span class="format-icon">📝</span>
                                <span class="format-name">Markdown</span>
                                <span class="format-desc">适合编辑和分享</span>
                            </div>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="exportFormat" value="html">
                            <div class="format-card">
                                <span class="format-icon">📄</span>
                                <span class="format-name">HTML</span>
                                <span class="format-desc">精美排版报纸风格</span>
                            </div>
                        </label>
                        <label class="format-option">
                            <input type="radio" name="exportFormat" value="json">
                            <div class="format-card">
                                <span class="format-icon">📦</span>
                                <span class="format-name">JSON</span>
                                <span class="format-desc">结构化数据</span>
                            </div>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="exportTitle" placeholder="昨日晚报 - YYYY年MM月DD日">
                </div>
                <div class="form-group">
                    <label>日期范围</label>
                    <div class="date-range">
                        <input type="date" id="exportDateFrom">
                        <span>至</span>
                        <input type="date" id="exportDateTo">
                    </div>
                </div>
                <div class="form-group">
                    <label>分类筛选（可选）</label>
                    <select id="exportCategory">
                        <option value="">全部分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>最大条数</label>
                    <input type="number" id="exportMaxItems" value="200" min="10" max="1000">
                </div>
                <button class="btn-primary btn-export" onclick="doExport()">生成导出</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js?v=8"></script>
</body>
</html>
