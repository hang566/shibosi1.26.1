<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OC 养成</title>
    <link href="../../../ui/css/modules/display.css" rel="stylesheet">
    <link href="../../../ui/css/modules/feedback.css" rel="stylesheet">
    <link href="../../../ui/css/modules/forms.css" rel="stylesheet">
    <link href="../../../ui/css/modules/layout.css" rel="stylesheet">
    <link href="../../../ui/css/modules/navigation.css" rel="stylesheet">
    <link href="../../../ui/css/modules/tabs-browser.css" rel="stylesheet">
    <link href="../../../ui/css/modules/variables.css" rel="stylesheet">

    <script src="../../../ui/js/modules/modal.js"></script>
    <script src="../../../ui/js/modules/tabs.js"></script>
    <script src="../../../ui/js/modules/theme.js"></script>
    <script src="../../../js/pointsSystem.js"></script>
    <script src="../../../js/syncManager.js"></script>
    <script src="../../../js/userAccount.js" defer></script>

    <style>
        :root {
            --info-panel-width: 260px;
            --info-panel-top: 80px;
            --info-panel-left: 20px;
            --info-panel-opacity: 0.6;

            --action-panel-width: 300px;
            --action-panel-bottom: 20px;
            --action-panel-right: 20px;
            --action-panel-opacity: 0.7;

            --dialog-box-width: 550px;
            --dialog-box-bottom: 260px;
            --dialog-box-left: 50%;
            --dialog-box-opacity: 0.75;

            --panel-border-radius: 16px;
            --panel-blur: 20px;
            --panel-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

            --action-panel-height: 320px;

            --bg-position-x: center;
            --bg-position-y: center;
            --bg-size: cover;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: transparent;
            backdrop-filter: none;
            box-shadow: none;
        }

        .navbar,
        .navbar * {
            color: rgba(255, 255, 255, 0.9);
        }

        .navbar .navbar-brand a {
            color: #818cf8;
        }

        .navbar .navbar-brand a:hover {
            color: #a5b4fc;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar .navbar-left span {
            color: rgba(255, 255, 255, 0.6);
        }

        .navbar .navbar-left .navbar-current {
            font-weight: 500;
            opacity: 1;
            color: rgba(255, 255, 255, 0.9);
        }

        .navbar-brand a {
            color: var(--main);
            text-decoration: none;
        }

        .navbar-brand a:hover {
            text-decoration: underline;
        }

        .oc-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            padding-top: 60px;
            --text: rgba(255, 255, 255, 0.95);
            --main: #6366f1;
            --border: rgba(255, 255, 255, 0.15);
            --card-bg: rgba(30, 30, 40, 0.95);
            --block-bg: rgba(255, 255, 255, 0.05);
        }

        .character-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: var(--bg-size);
            background-position: var(--bg-position-x) var(--bg-position-y);
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 0;
            transition: opacity 0.8s ease;
        }

        .character-bg.has-bg-image {
            opacity: 0.85;
        }

        .character-bg.has-live2d {
            opacity: 0.3;
        }

        .character-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.05) 30%, rgba(0, 0, 0, 0.2) 70%, rgba(0, 0, 0, 0.4) 100%);
        }

        .character-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .character-area.show-live2d {
            display: flex;
        }

        .live2d-container {
            width: 400px;
            height: 600px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: auto;
        }

        .character-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center bottom;
            filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.6));
        }

        .info-panel {
            position: absolute;
            top: var(--info-panel-top);
            left: var(--info-panel-left);
            background: rgba(0, 0, 0, var(--info-panel-opacity, 0.82));
            backdrop-filter: blur(var(--panel-blur));
            -webkit-backdrop-filter: blur(var(--panel-blur));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--panel-border-radius);
            padding: 20px;
            width: var(--info-panel-width);
            max-width: calc(100% - 40px);
            z-index: 10;
            color: var(--text);
            box-shadow: var(--panel-shadow);
            transition: all 0.3s ease;
        }

        .info-header {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .character-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--main);
            margin-bottom: 4px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .character-type {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 0.75rem;
            opacity: 0.8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .status-item span:first-child {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
            opacity: 0.9;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .progress {
            height: 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 100%;
            border-radius: 7px;
            transition: width 0.5s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6px;
            font-size: 0.65rem;
            font-weight: 500;
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .progress-bar.life {
            background: linear-gradient(90deg, #ff6b6b, #ee5a5a);
        }

        .progress-bar.hunger {
            background: linear-gradient(90deg, #ffd93d, #f9c80e);
        }

        .progress-bar.energy {
            background: linear-gradient(90deg, #6bcb77, #4dac5d);
        }

        .progress-bar.mood {
            background: linear-gradient(90deg, #4d96ff, #357abd);
        }

        .status-effects {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .status-badge.buff {
            background: rgba(79, 172, 254, 0.2);
            border: 1px solid rgba(79, 172, 254, 0.4);
            color: #4facfe;
        }

        .status-badge.debuff {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.4);
            color: #ff6b6b;
        }

        .status-badge:hover {
            transform: scale(1.05);
        }

        .status-icon {
            font-size: 0.7rem;
        }

        .status-name {
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-time {
            opacity: 0.7;
            font-size: 0.55rem;
        }

        .dialog-box {
            position: absolute;
            bottom: var(--dialog-box-bottom);
            left: var(--dialog-box-left);
            transform: translateX(-50%);
            background: rgba(0, 0, 0, var(--dialog-box-opacity, 0.88));
            backdrop-filter: blur(calc(var(--panel-blur) + 5px));
            -webkit-backdrop-filter: blur(calc(var(--panel-blur) + 5px));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: calc(var(--panel-border-radius) + 4px);
            padding: 16px 24px;
            max-width: var(--dialog-box-width);
            width: calc(100% - 40px);
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .dialog-box::-webkit-scrollbar {
            width: 4px;
        }

        .dialog-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .dialog-box::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .dialog-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: var(--main);
            border-radius: 50%;
            margin-right: 12px;
            font-size: 16px;
            vertical-align: middle;
        }

        .dialog-text {
            display: inline;
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0.95;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .dialog-name {
            font-weight: 600;
            color: var(--main);
            margin-right: 8px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .dialog-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dialog-option {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .dialog-option:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--main);
            transform: translateY(-2px);
        }

        .dialog-option:active {
            transform: translateY(0);
        }

        .action-panel {
            position: fixed;
            bottom: var(--action-panel-bottom);
            right: var(--action-panel-right);
            background: rgba(0, 0, 0, var(--action-panel-opacity, 0.88));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 14px;
            width: var(--action-panel-width);
            max-width: calc(100% - 40px);
            max-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        }

        .panel-tabs {
            flex-shrink: 0;
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .panel-tabs::-webkit-scrollbar {
            height: 3px;
        }

        .panel-tabs::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-tabs::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .panel-tabs::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .panel-tab {
            flex-shrink: 0;
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .panel-tab.active {
            background: var(--main);
            color: white;
            font-weight: 600;
        }

        .panel-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }

        .panel-content-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .panel-content-area::-webkit-scrollbar {
            width: 5px;
        }

        .panel-content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-content-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .panel-content-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.9);
        }

        .action-btn:hover {
            background: var(--main);
            border-color: var(--main);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        }

        .action-btn svg {
            width: 24px;
            height: 24px;
        }

        .action-btn .action-name {
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .action-btn .action-effect {
            font-size: 0.62rem;
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            white-space: nowrap;
            font-weight: 600;
            transition: color 0.2s ease;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .action-btn:hover .action-effect {
            color: rgba(255, 255, 255, 0.95);
        }

        .mobile-card {
            display: contents;
        }

        .action-grid-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .panel-actions {
            flex-shrink: 0;
            display: flex;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .panel-actions::-webkit-scrollbar {
            height: 3px;
        }

        .panel-actions::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-actions::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .panel-actions::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .panel-btn {
            flex-shrink: 0;
            padding: 7px 12px;
            border: none;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .panel-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        @media (max-width: 950px) {
            :root {
                --info-panel-width: 220px;
                --action-panel-width: 260px;
                --dialog-box-width: 450px;
            }

            .dialog-box {
                max-width: calc(100% - var(--action-panel-width) - var(--action-panel-right) - 40px);
            }
        }

        @media (max-width: 800px) {
            :root {
                --info-panel-width: 200px;
                --action-panel-width: 240px;
                --dialog-box-width: 400px;
                --action-panel-height: 220px;
            }

            .live2d-container {
                width: 320px;
                height: 500px;
            }
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                max-height: 85vh;
                border-radius: 20px;
            }

            .backpack-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }

            .backpack-item {
                padding: 8px 4px;
            }

            .backpack-item .item-icon {
                font-size: 20px;
            }

            .backpack-item .item-name {
                font-size: 0.65rem;
            }

            .store-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .store-item {
                padding: 10px;
            }

            .store-item .item-icon {
                font-size: 28px;
            }

            .store-item .item-name {
                font-size: 0.8rem;
            }

            .store-item .item-desc {
                font-size: 0.7rem;
            }

            .menu {
                flex-wrap: wrap;
            }

            .menu-item {
                padding: 6px 8px;
                font-size: 0.72rem;
            }

            .buy-btn {
                padding: 5px 10px;
                font-size: 0.75rem;
            }

            .modal-content h3 {
                font-size: 1.2rem;
                margin-bottom: 16px;
            }

            .modal-content input,
            .modal-content select {
                padding: 10px 12px;
                font-size: 0.9rem;
            }

            .switch {
                width: 44px;
                height: 24px;
            }

            .slider:before {
                height: 18px;
                width: 18px;
                left: 3px;
                bottom: 3px;
            }

            input:checked+.slider:before {
                transform: translateX(20px);
            }
        }

        @media (max-width: 700px) {
            :root {
                --info-panel-width: 180px;
                --action-panel-width: 220px;
                --dialog-box-width: 350px;
            }

            .info-panel {
                top: 70px;
                left: 15px;
                padding: 16px;
            }

            .character-name {
                font-size: 1.1rem;
            }

            .action-panel {
                bottom: 15px;
                right: 15px;
                padding: 12px;
            }

            .dialog-box {
                max-width: calc(100% - 30px);
                left: 15px;
                right: 15px;
                transform: none;
            }
        }

        @media (max-width: 600px) {
            .oc-container {
                padding-top: 0;
            }

            :root {
                --info-panel-width: var(--info-panel-width, auto);
                --info-panel-top: var(--info-panel-top, 10px);
                --info-panel-left: var(--info-panel-left, 10px);
                --action-panel-width: 100%;
                --action-panel-bottom: 0;
                --action-panel-right: 0;
                --dialog-box-width: 100%;
                --action-panel-height: 52vh;
            }

            .live2d-container {
                width: 280px;
                height: 450px;
            }

            .mobile-card {
                display: flex;
                flex-direction: column;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                height: var(--action-panel-height);
                background: rgba(30, 30, 40, 0.8);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-radius: 20px 20px 0 0;
                z-index: 100;
                box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.4);
                overflow: hidden;
            }

            .info-panel,
            .dialog-box,
            .action-panel {
                position: static;
                width: 100%;
                max-width: none;
                transform: none;
                margin: 0;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                border: none;
                background: transparent;
                z-index: auto;
                max-height: none;
                overflow: visible;
            }

            .info-panel {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 6px 14px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                order: 2;
                height: 36px;
                flex-shrink: 0;
            }

            .info-header {
                margin-bottom: 0;
                padding-bottom: 0;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .character-name {
                font-size: 0.8rem;
                margin-bottom: 0;
                font-weight: 600;
            }

            .character-type {
                font-size: 0.5rem;
                padding: 2px 5px;
            }

            .status-grid {
                display: flex;
                flex-direction: row;
                gap: 4px;
                flex: 1;
                justify-content: flex-end;
                margin-left: 8px;
            }

            .status-item {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 1px;
            }

            .status-item span:first-child {
                font-size: 0.45rem;

    <script>
        function updatePointsDisplay() {
            const pointsElement = document.getElementById('points');
            if (pointsElement && window.PointsSystem) {
                PointsSystem.loadPoints();
                const total = PointsSystem.getTotalPoints();
                pointsElement.textContent = total + ' 积分';
            }
        }

        function toggleNavbar() {
            const navbarNav = document.getElementById('navbar-nav');
            const navbarToggle = document.getElementById('navbar-toggle');
            const isActive = navbarNav.classList.toggle('active');
            navbarToggle.classList.toggle('active');
            navbarToggle.setAttribute('aria-expanded', isActive);
        }

        const OC_CONFIG_KEY = 'oc_config';
        const OC_STATUS_KEY = 'oc_status';
        const OC_BACKPACK_KEY = 'oc_backpack';
        const OC_UI_CONFIG_KEY = 'oc_ui_config';

        let ocConfig = {
            type: 'OC',
            name: '未命名',
            image: '',
            aiEnabled: false,
            aiModel: '',
            aiUrl: '',
            aiKey: '',
            aiPrompt: '',
            timeImageEnabled: false,
            images: {}
        };

        let ocStatus = {
            life: 75,
            hunger: 75,
            energy: 75,
            mood: 75
        };

        let backpack = {
            capacity: 12,
            items: []
        };
        let currentStoreFilter = 'all';
        let storeItems = [];
        let eventData = {};
        let chatData = {};

        let actionCount = 0;
        let lastDialogueTime = {};
        let dialogueTimer = null;
        let currentDialogue = null;
        let activeStatusEffects = [];
        let statusEffectTimer = null;

        function getTimePeriod() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return 'morning';
            if (hour >= 12 && hour < 18) return 'afternoon';
            return 'evening';
        }

        function analyzeImageBrightness(dataURL) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const sampleSize = 100;
                    canvas.width = sampleSize;
                    canvas.height = sampleSize;
                    ctx.drawImage(img, 0, 0, sampleSize, sampleSize);

                    const imageData = ctx.getImageData(0, 0, sampleSize, sampleSize);
                    const pixels = imageData.data;
                    let totalBrightness = 0;
                    let pixelCount = 0;

                    for (let i = 0; i < pixels.length; i += 4) {
                        if (pixels[i + 3] > 128) {
                            const r = pixels[i];
                            const g = pixels[i + 1];
                            const b = pixels[i + 2];
                            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                            totalBrightness += brightness;
                            pixelCount++;
                        }
                    }

                    const avgBrightness = pixelCount > 0 ? totalBrightness / pixelCount : 128;
                    resolve(avgBrightness);
                };
                img.onerror = () => {
                    resolve(128);
                };
                img.src = dataURL;
            });
        }

        function applyBrightnessClass(brightness) {
            const container = document.querySelector('.oc-container');
            container.classList.remove('bright-bg', 'dark-bg', 'neutral-bg');

            if (brightness > 160) {
                container.classList.add('bright-bg');
            } else if (brightness < 80) {
                container.classList.add('dark-bg');
            } else {
                container.classList.add('neutral-bg');
            }
        }

        function checkDialogueCondition(dialogue) {
            const trigger = dialogue.trigger;
            if (!trigger) return true;

            const now = Date.now();
            const period = getTimePeriod();

            if (trigger.interval && lastDialogueTime[dialogue.id]) {
                if (now - lastDialogueTime[dialogue.id] < trigger.interval) {
                    return false;
                }
            }

            if (trigger.time && !trigger.time.includes(period)) {
                return false;
            }

            if (trigger.status) {
                for (const [key, condition] of Object.entries(trigger.status)) {
                    if (condition.max && ocStatus[key] > condition.max) return false;
                    if (condition.min && ocStatus[key] < condition.min) return false;
                }
            }

            if (trigger.actionCount) {
                if (trigger.actionCount.min && actionCount < trigger.actionCount.min) return false;
                if (trigger.actionCount.max && actionCount > trigger.actionCount.max) return false;
            }

            return true;
        }

        function getAvailableDialogues() {
            if (!chatData.dialogues || !Array.isArray(chatData.dialogues)) return [];
            return chatData.dialogues.filter(dialogue => checkDialogueCondition(dialogue));
        }

        function showDialogue(dialogue) {
            if (!dialogue) return;

            currentDialogue = dialogue;
            lastDialogueTime[dialogue.id] = Date.now();

            updateStatus(dialogue.content);
            renderDialogueOptions(dialogue.options);
        }

        function renderDialogueOptions(options) {
            const container = document.getElementById('dialogOptions');
            container.innerHTML = '';

            if (!options || !Array.isArray(options) || options.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'dialog-option';
                btn.textContent = option.text;
                btn.onclick = () => selectDialogueOption(option);
                container.appendChild(btn);
            });
        }

        function selectDialogueOption(option) {
            const container = document.getElementById('dialogOptions');
            container.innerHTML = '';
            container.style.display = 'none';

            let canProceed = true;

            if (option.consumeItem) {
                if (!consumeBackpackItem(option.consumeItem)) {
                    updateStatus('你没有这个道具！');
                    canProceed = false;
                }
            }

            if (canProceed) {
                if (!option.skipStatusEffect && option.effect) {
                    applyEffect(option.effect);
                }

                if (option.applyStatus) {
                    const statusData = {
                        ...option.applyStatus,
                        startTime: Date.now()
                    };
                    activeStatusEffects.push(statusData);
                    renderStatusEffects();
                }

                if (option.removeStatus) {
                    removeStatusEffect(option.removeStatus);
                }

                if (option.reward && option.reward.points && window.PointsSystem) {
                    PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, option.reward.points);
                }

                if (option.points && option.points > 0 && window.PointsSystem) {
                    PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, option.points);
                }

                if (option.response) {
                    updateStatus(option.response);
                }
            }
        }

        function checkAllDialogueTriggers() {
            const available = getAvailableDialogues();
            if (available.length > 0) {
                const randomDialogue = available[Math.floor(Math.random() * available.length)];
                showDialogue(randomDialogue);
                return true;
            }
            return false;
        }

        function startDialogueTimer() {
            if (dialogueTimer) clearInterval(dialogueTimer);

            dialogueTimer = setInterval(() => {
                if (!currentDialogue) {
                    checkAllDialogueTriggers();
                }
            }, 30000);
        }

        function triggerStatusEvent(eventId) {
            const event = eventData.status_events?.[eventId];
            if (!event) return;

            const existingIndex = activeStatusEffects.findIndex(e => e.id === eventId);
            if (existingIndex !== -1) {
                return;
            }

            if (event.type === 'buff') {
                applyEffect(event.effect);

                const effectData = {
                    id: eventId,
                    name: event.name,
                    type: event.type,
                    effect: event.effect,
                    duration: event.duration || 600000,
                    startTime: Date.now(),
                    removeItem: event.removeItem,
                    reward: event.reward
                };
                activeStatusEffects.push(effectData);
                renderStatusEffects();

                const typeText = '获得';
                updateStatus(`${typeText}【${event.name}】！${event.description || ''}`);
                showNotification(`${typeText}${event.name}`, 'success');

                if (event.reward && event.reward.points && window.PointsSystem) {
                    PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, event.reward.points);
                }
                return;
            }

            const options = [];

            if (event.removeItem) {
                const item = storeItems.find(i => i.id === event.removeItem);
                options.push({
                    text: `使用${item?.name || event.removeItem}处理`,
                    effect: {},
                    response: `使用${item?.name || event.removeItem}成功解除了${event.name}！`,
                    consumeItem: event.removeItem,
                    skipStatusEffect: true
                });
            }

            options.push({
                text: '硬扛着',
                effect: event.effect,
                response: `你决定硬扛着${event.name}...`,
                applyStatus: {
                    id: eventId,
                    name: event.name,
                    type: event.type,
                    effect: event.effect,
                    duration: event.duration || 600000,
                    removeItem: event.removeItem
                },
                reward: event.reward
            });

            const dialogue = {
                id: `status_${eventId}_${Date.now()}`,
                content: `${event.name}！${event.description || ''}`,
                options: options
            };

            showDialogue(dialogue);
        }

        function removeStatusEffect(eventId) {
            const index = activeStatusEffects.findIndex(e => e.id === eventId);
            if (index !== -1) {
                const effect = activeStatusEffects[index];
                activeStatusEffects.splice(index, 1);
                showNotification(`${effect.name}状态消失`, 'info');
                renderStatusEffects();
            }
        }

        function tryRemoveStatusEffect(eventId) {
            const effect = activeStatusEffects.find(e => e.id === eventId);
            if (!effect) return false;

            if (effect.removeItem) {
                const storeItem = storeItems.find(i => i.id === effect.removeItem);
                const hasItem = backpack.items.some(item => item.id === effect.removeItem && !isItemExpired(item) && !isItemBroken(item));

                const options = [];

                if (hasItem) {
                    options.push({
                        text: `使用${storeItem.name}解除`,
                        effect: {},
                        response: `使用${storeItem.name}解除了${effect.name}`,
                        consumeItem: effect.removeItem,
                        removeStatus: eventId,
                        skipStatusEffect: true
                    });
                }

                options.push({
                    text: '暂时不处理',
                    effect: {},
                    response: '你决定暂时不处理...'
                });

                const dialogue = {
                    id: `remove_status_${eventId}_${Date.now()}`,
                    content: `你想解除【${effect.name}】状态吗？${hasItem ? `你有${storeItem.name}可以使用。` : `你需要${storeItem.name}才能解除。`}`,
                    options: options
                };

                showDialogue(dialogue);
            } else {
                removeStatusEffect(eventId);
                showNotification(`解除了${effect.name}`, 'success');
                return true;
            }
            return false;
        }

        function renderStatusEffects() {
            const container = document.getElementById('statusEffects');
            if (!container) {
                const infoPanel = document.querySelector('.info-panel');
                if (infoPanel) {
                    const effectsDiv = document.createElement('div');
                    effectsDiv.id = 'statusEffects';
                    effectsDiv.className = 'status-effects';
                    infoPanel.appendChild(effectsDiv);
                }
                return;
            }

            container.innerHTML = '';

            if (activeStatusEffects.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            activeStatusEffects.forEach(effect => {
                const remaining = Math.ceil((effect.duration - (Date.now() - effect.startTime)) / 60000);
                const isBuff = effect.type === 'buff';

                const badge = document.createElement('div');
                badge.className = `status-badge ${isBuff ? 'buff' : 'debuff'}`;
                badge.title = `${effect.name}\n剩余 ${remaining} 分钟`;

                if (effect.removeItem) {
                    badge.style.cursor = 'pointer';
                    badge.onclick = () => tryRemoveStatusEffect(effect.id);
                }

                badge.innerHTML = `
                    <span class="status-icon">${isBuff ? '✨' : '💫'}</span>
                    <span class="status-name">${effect.name}</span>
                    <span class="status-time">${remaining}m</span>
                `;
                container.appendChild(badge);
            });
        }

        function updateStatusEffects() {
            const now = Date.now();
            let changed = false;

            for (let i = activeStatusEffects.length - 1; i >= 0; i--) {
                const effect = activeStatusEffects[i];
                if (now - effect.startTime >= effect.duration) {
                    activeStatusEffects.splice(i, 1);
                    changed = true;
                }
            }

            if (changed) {
                renderStatusEffects();
            }
        }

        function startStatusEffectTimer() {
            if (statusEffectTimer) clearInterval(statusEffectTimer);

            statusEffectTimer = setInterval(() => {
                updateStatusEffects();
            }, 30000);
        }

        function checkStatusEvents() {
            if (!eventData.status_events) return;

            const events = Object.entries(eventData.status_events);
            for (const [id, event] of events) {
                if (event.chance && Math.random() < event.chance) {
                    triggerStatusEvent(id);
                    break;
                }
            }
        }

        function initIdlePointsSystem() {
            const now = Date.now();
            const lastActiveStr = localStorage.getItem(OC_IDLE_KEY);
            const lastActive = lastActiveStr ? parseInt(lastActiveStr) : now;

            if (!document.hidden) {
                const awayMs = now - lastActive;
                const awayHours = Math.floor(awayMs / 3600000);
                if (awayHours >= 1) {
                    const points = awayHours * 35;
                    if (window.PointsSystem) {
                        PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, points);
                        showNotification(`离线奖励 +${points} 积分`, 'success');
                    }
                }
            }

            localStorage.setItem(OC_IDLE_KEY, now.toString());

            function startActiveTimer() {
                if (idlePointsTimer) clearInterval(idlePointsTimer);
                idlePointsTimer = setInterval(() => {
                    if (!document.hidden && window.PointsSystem) {
                        PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, 10);
                        showNotification('在线奖励 +10 积分', 'success');
                    }
                }, 60000);
            }

            function handleVisibilityChange() {
                const now = Date.now();
                if (document.hidden) {
                    if (idlePointsTimer) {
                        clearInterval(idlePointsTimer);
                        idlePointsTimer = null;
                    }
                    localStorage.setItem(OC_IDLE_KEY, now.toString());
                } else {
                    const lastActiveStr = localStorage.getItem(OC_IDLE_KEY);
                    const lastActive = lastActiveStr ? parseInt(lastActiveStr) : now;
                    const awayMs = now - lastActive;
                    const awayHours = Math.floor(awayMs / 3600000);
                    if (awayHours >= 1) {
                        const points = awayHours * 35;
                        if (window.PointsSystem) {
                            PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, points);
                            showNotification(`离线奖励 +${points} 积分`, 'success');
                        }
                    }
                    localStorage.setItem(OC_IDLE_KEY, now.toString());
                    startActiveTimer();
                }
            }

            document.addEventListener('visibilitychange', handleVisibilityChange);

            if (!document.hidden) {
                startActiveTimer();
            }

            window.addEventListener('beforeunload', () => {
                localStorage.setItem(OC_IDLE_KEY, Date.now().toString());
            });
        }

        async function loadData() {
            try {
                const [shopRes, eventRes, chatRes] = await Promise.all([
                    fetch('Shop.json'),
                    fetch('Event.json'),
                    fetch('chat.json')
                ]);
                storeItems = await shopRes.json();
                eventData = await eventRes.json();
                chatData = await chatRes.json();
                renderActionButtons();

                console.error('Failed to load data:', e);

        function renderActionButtons() {
            const categories = ['clean', 'rest', 'feed', 'play', 'games'];
            const actionFunctions = {
                clean: 'actionClean',
                rest: 'actionRest',
                feed: 'actionFeed',
                play: 'actionPlay',
                games: 'actionGame'
            };

            const tabsContainer = document.getElementById('panelTabs');
            if (tabsContainer && chatData.tabs) {
                tabsContainer.innerHTML = '';
                const tabOrder = ['Clean', 'Rest', 'Feed', 'Play', 'Games'];
                tabOrder.forEach((tabId, index) => {
                    const tabName = chatData.tabs[tabId] || tabId;
                    const btn = document.createElement('button');
                    btn.className = 'panel-tab' + (tabId === 'Feed' ? ' active' : '');
                    btn.onclick = () => switchPanelTab(tabId);
                    btn.textContent = tabName;
                    tabsContainer.appendChild(btn);
                });
            }

            categories.forEach(category => {
                const grid = document.getElementById(`actionGrid${category.charAt(0).toUpperCase() + category.slice(1)}`);
                if (!grid || !eventData[category]) return;

                grid.innerHTML = '';
                const actions = eventData[category];

                Object.keys(actions).forEach(actionKey => {
                    const action = actions[actionKey];
                    const effectText = formatEffect(action.effect);
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';

                    if (category === 'games') {
                        btn.onclick = () => actionGame(actionKey);
                    } else {
                        btn.onclick = () => window[actionFunctions[category]](actionKey);
                    }

                    btn.title = `${action.name}`;
                    btn.innerHTML = `
                        ${action.icon}
                        <span class="action-name">${action.name}</span>
                        <span class="action-effect">${effectText}</span>
                    `;
                    grid.appendChild(btn);
                });
            });
        }

        function formatEffect(effect) {
            if (!effect) return '';
            const parts = [];
            const emojis = {
                life: '❤️',
                hunger: '🍔',
                energy: '⚡',
                mood: '😊'
            };

            Object.keys(effect).forEach(key => {
                const value = effect[key];
                const emoji = emojis[key] || key;
                const sign = value > 0 ? '+' : '';
                parts.push(`${emoji}${sign}${value}`);
            });

            return parts.join(' ');
        }

                    backpack = parsed;

                    backpack = {

                    for (const [id, count] of Object.entries(oldBackpack)) {
                        for (let i = 0; i < count; i++) {
                            backpack.items.push({

                                durability: null,

                            });

        function applyUIConfig(config) {
            const root = document.documentElement;
            const infoPanel = document.querySelector('.info-panel');
            const actionPanel = document.querySelector('.action-panel');
            const dialogBox = document.querySelector('.dialog-box');
            const characterBg = document.querySelector('.character-bg');

            // 背景图片 - 直接设到元素
            if (characterBg) {
                if (config.bgPosX !== undefined) characterBg.style.backgroundPositionX = config.bgPosX;
                if (config.bgPosY !== undefined) characterBg.style.backgroundPositionY = config.bgPosY;
                if (config.bgSize !== undefined) characterBg.style.backgroundSize = config.bgSize;
            }

            // 布局属性 - 内联样式 + !important 覆盖媒体查询
            if (infoPanel) {
                if (config.infoWidth !== undefined) infoPanel.style.setProperty('width', config.infoWidth + 'px', 'important');
                if (config.infoTop !== undefined) infoPanel.style.setProperty('top', config.infoTop + 'px', 'important');
                if (config.infoLeft !== undefined) infoPanel.style.setProperty('left', config.infoLeft + 'px', 'important');
            }
            if (actionPanel) {
                if (config.actionWidth !== undefined) actionPanel.style.setProperty('width', config.actionWidth + 'px', 'important');
                if (config.actionBottom !== undefined) actionPanel.style.setProperty('bottom', config.actionBottom + 'px', 'important');
                if (config.actionRight !== undefined) actionPanel.style.setProperty('right', config.actionRight + 'px', 'important');
            }
            if (dialogBox) {
                if (config.dialogWidth !== undefined) dialogBox.style.setProperty('max-width', config.dialogWidth + 'px', 'important');
                if (config.dialogBottom !== undefined) dialogBox.style.setProperty('bottom', config.dialogBottom + 'px', 'important');
                if (config.dialogLeft !== undefined) dialogBox.style.setProperty('left', config.dialogLeft + '%', 'important');
            }

            // CSS 变量 - 必须设到 :root 才能让子元素继承使用
            if (config.infoOpacity !== undefined) root.style.setProperty('--info-panel-opacity', config.infoOpacity / 100);
            if (config.actionOpacity !== undefined) root.style.setProperty('--action-panel-opacity', config.actionOpacity / 100);
            if (config.dialogOpacity !== undefined) root.style.setProperty('--dialog-box-opacity', config.dialogOpacity / 100);
            if (config.blur !== undefined) root.style.setProperty('--panel-blur', config.blur + 'px');
            if (config.radius !== undefined) root.style.setProperty('--panel-border-radius', config.radius + 'px');
        }

            document.getElementById('dialogBottom').value = 260;
            document.getElementById('dialogLeft').value = 50;
            document.getElementById('dialogOpacity').value = 75;
            document.getElementById('blur').value = 20;
            document.getElementById('radius').value = 16;

            updateUIValues();
        }

        function initUIControls() {
            console.log('[OC UI] initUIControls called');

            const rangeControls = [
                'infoWidth', 'infoTop', 'infoLeft', 'infoOpacity',
                'actionWidth', 'actionBottom', 'actionRight', 'actionOpacity',
                'dialogWidth', 'dialogBottom', 'dialogLeft', 'dialogOpacity', 'blur', 'radius'
            ];

            rangeControls.forEach(id => {
                const el = document.getElementById(id);
                console.log('[OC UI] Found element:', id, el);
                if (el) {
                    el.addEventListener('input', function () {
                        console.log('[OC UI] Input event:', id, this.value);
                        const valEl = document.getElementById(id + 'Val');
                        if (valEl) {
                            valEl.textContent = this.value;
                        }
                        saveUIConfig();
                    });
                }
            });

            const selectControls = ['bgPosX', 'bgPosY', 'bgSize'];
            selectControls.forEach(id => {
                const el = document.getElementById(id);
                console.log('[OC UI] Found select:', id, el);
                if (el) {
                    el.addEventListener('change', function () {
                        console.log('[OC UI] Change event:', id, this.value);
                        const valEl = document.getElementById(id + 'Val');
                        if (valEl) {
                            valEl.textContent = this.options[this.selectedIndex].text;
                        }
                        saveUIConfig();
                    });
                }
            });

            const saved = localStorage.getItem(OC_UI_CONFIG_KEY);
            if (saved) {
                const uiConfig = JSON.parse(saved);
                for (const [key, value] of Object.entries(uiConfig)) {
                    const el = document.getElementById(key);
                    if (el) {
                        if (el.type === 'checkbox') {
                            el.checked = value;
                        } else {
                            el.value = value;
                        }
                        const valEl = document.getElementById(key + 'Val');
                        if (valEl) {
                            if (el.tagName === 'SELECT') {
                                valEl.textContent = el.options[el.selectedIndex].text;
                            } else {
                                valEl.textContent = value;
                            }
                        }
                    }
                }
            }


        }

        function updateUIValues() {
            const controls = [
                'infoWidth', 'infoTop', 'infoLeft', 'infoOpacity',
                'actionWidth', 'actionBottom', 'actionRight', 'actionOpacity',
                'dialogWidth', 'dialogBottom', 'dialogLeft', 'dialogOpacity', 'blur', 'radius'
            ];

            controls.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    document.getElementById(id + 'Val').textContent = el.value;
                }
            });

            const selectControls = ['bgPosX', 'bgPosY', 'bgSize'];
            selectControls.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    document.getElementById(id + 'Val').textContent = el.options[el.selectedIndex].text;
                }
            });
        }



        function saveConfig() {
            ocConfig.type = document.getElementById('ocType').value;
            ocConfig.name = document.getElementById('ocName').value || '未命名';
            ocConfig.aiEnabled = document.getElementById('aiEnabled').checked;
            ocConfig.aiModel = document.getElementById('aiModel').value;
            ocConfig.aiUrl = document.getElementById('aiUrl').value;
            ocConfig.aiKey = document.getElementById('aiKey').value;
            ocConfig.aiPrompt = document.getElementById('aiPrompt').value;
            ocConfig.timeImageEnabled = document.getElementById('timeImageEnabled').checked;

            const mainFile = document.getElementById('uploadImageMain').files[0];
            if (mainFile) {
                const reader = new FileReader();
                reader.onload = async function (e) {
                    ocConfig.image = e.target.result;
                    const brightness = await analyzeImageBrightness(e.target.result);
                    ocConfig.imageBrightness = brightness;
                    applyBrightnessClass(brightness);
                    try {
                        localStorage.setItem(OC_CONFIG_KEY, JSON.stringify(ocConfig));
                        renderCharacter();
                        closeModal('modal');
                        showNotification(chatData.notification?.saveSuccess || '配置已保存', 'success');
                    } catch (e) {
                        console.error('Failed to save config:', e);
                        showNotification(chatData.notification?.saveFailImage || '保存失败，存储空间不足，请尝试使用较小的图片', 'error');
                    }
                };
                reader.readAsDataURL(mainFile);
            } else {
                try {
                    localStorage.setItem(OC_CONFIG_KEY, JSON.stringify(ocConfig));
                    renderCharacter();
                    closeModal('modal');
                    showNotification(chatData.notification?.saveSuccess || '配置已保存', 'success');
                } catch (e) {
                    console.error('Failed to save config:', e);
                    showNotification(chatData.notification?.saveFail || '保存失败，存储空间不足', 'error');
                }
            }
        }

        function renderCharacter() {
            const nameEl = document.getElementById('characterName');
            const typeEl = document.getElementById('characterType');
            const imageEl = document.getElementById('characterImage');
            const bgEl = document.getElementById('characterBg');
            const dialogNameEl = document.getElementById('dialogName');
            const emojiEl = document.getElementById('characterEmoji');
            const characterAreaEl = document.querySelector('.character-area');

            nameEl.textContent = ocConfig.name;
            dialogNameEl.textContent = ocConfig.name;

            const typeNames = { 'OC': '原创角色', 'pet': '宠物', 'friend': '朋友', 'other': '其他' };
            typeEl.textContent = typeNames[ocConfig.type] || ocConfig.type;

            bgEl.classList.remove('has-bg-image', 'has-live2d');
            if (characterAreaEl) {
                characterAreaEl.classList.remove('show-live2d');
            }

            if (ocConfig.image) {
                bgEl.style.backgroundImage = `url(${ocConfig.image})`;

                if (ocConfig.live2dEnabled && ocConfig.live2dModel) {
                    bgEl.classList.add('has-live2d');
                    if (characterAreaEl) {
                        characterAreaEl.classList.add('show-live2d');
                    }
                    imageEl.src = ocConfig.image;
                    imageEl.style.display = 'block';
                    emojiEl.style.display = 'none';
                } else {
                    bgEl.classList.add('has-bg-image');
                    imageEl.src = '';
                    imageEl.style.display = 'none';
                    emojiEl.style.display = 'none';
                }
            } else {
                bgEl.style.backgroundImage = '';
                imageEl.src = '';
                imageEl.style.display = 'none';
                emojiEl.style.display = 'block';
            }

            if (ocConfig.imageBrightness !== undefined) {
                applyBrightnessClass(ocConfig.imageBrightness);
            }
        }

        function renderStatus() {
            updateBar('lifeBar', ocStatus.life);
            updateBar('hungerBar', ocStatus.hunger);
            updateBar('energyBar', ocStatus.energy);
            updateBar('moodBar', ocStatus.mood);
        }

        function updateBar(id, value) {
            const bar = document.getElementById(id);
            if (bar) {
                bar.style.width = `${value}%`;
                bar.textContent = `${value}%`;
            }
        }

        function saveStatus() {
            try {
                localStorage.setItem(OC_STATUS_KEY, JSON.stringify(ocStatus));
            } catch (e) {
                console.error('Failed to save status:', e);
                showNotification(chatData.notification?.saveFail || '保存失败，存储空间不足', 'error');
            }
        }

        function saveBackpack() {
            try {
                localStorage.setItem(OC_BACKPACK_KEY, JSON.stringify(backpack));
            } catch (e) {
                console.error('Failed to save backpack:', e);
                showNotification(chatData.notification?.saveFail || '保存失败，存储空间不足', 'error');
            }
        }

        function decreaseStatus() {
            ocStatus.hunger = Math.max(0, ocStatus.hunger - 2);
            ocStatus.energy = Math.max(0, ocStatus.energy - 1);
            ocStatus.mood = Math.max(0, ocStatus.mood - 1);

            if (ocStatus.hunger < 20) {
                ocStatus.life = Math.max(0, ocStatus.life - 1);
            }
            if (ocStatus.energy < 10) {
                ocStatus.life = Math.max(0, ocStatus.life - 1);
            }

            renderStatus();
            saveStatus();
        }

        function applyEffect(effect) {
            if (effect.life) ocStatus.life = Math.min(100, Math.max(0, ocStatus.life + effect.life));
            if (effect.hunger) ocStatus.hunger = Math.min(100, Math.max(0, ocStatus.hunger + effect.hunger));
            if (effect.energy) ocStatus.energy = Math.min(100, Math.max(0, ocStatus.energy + effect.energy));
            if (effect.mood) ocStatus.mood = Math.min(100, Math.max(0, ocStatus.mood + effect.mood));

            renderStatus();
            saveStatus();
        }

        function consumeBackpackItem(itemId) {
            if (!itemId) return true;

            const index = backpack.items.findIndex(item => item.id === itemId && !isItemExpired(item) && !isItemBroken(item));
            if (index === -1) {
                const itemInfo = storeItems.find(i => i.id === itemId);
                if (itemInfo) {
                    showNotification(`背包中没有${itemInfo.name}，无法进行此操作！`, 'error');
                } else {
                    showNotification('背包中缺少所需物品！', 'error');
                }
                return false;
            }

            const item = backpack.items[index];
            const storeItem = storeItems.find(i => i.id === itemId);

            if (storeItem.durability && storeItem.durability > 0) {
                item.durability = (item.durability || storeItem.durability) - storeItem.durabilityDrop;
                if (item.durability <= 0) {
                    showNotification(`${storeItem.name}坏掉了...`, 'error');
                    backpack.items.splice(index, 1);
                }
            } else {
                backpack.items.splice(index, 1);
            }

            saveBackpack();
            renderBackpack();
            return true;
        }

        function actionClean(type) {
            const action = eventData.clean?.[type];
            if (!action) return;

            if (!consumeBackpackItem(action.consumeItem)) return;

            applyEffect(action.effect || {});
            updateStatus(chatData.clean?.[type] || `正在${action.name}...`);
            showNotification(chatData.notification?.clean || '清洁完成！', 'success');
            actionCount++;

            setTimeout(() => {
                checkAllDialogueTriggers();
            }, 2000);

            if (window.PointsSystem) {
                PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, 5);
            }
        }

        function actionRest(type) {
            const action = eventData.rest?.[type];
            if (!action) return;

            if (!consumeBackpackItem(action.consumeItem)) return;

            applyEffect(action.effect || {});
            updateStatus(chatData.rest?.[type] || `正在${action.name}...`);
            showNotification(chatData.notification?.rest || '休息好了！', 'success');
            actionCount++;

            setTimeout(() => {
                checkAllDialogueTriggers();
            }, 2000);

            if (window.PointsSystem) {
                PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, 5);
            }
        }

        function actionFeed(type) {
            const action = eventData.feed?.[type];
            if (!action) return;

            if (!consumeBackpackItem(action.consumeItem)) return;

            applyEffect(action.effect || {});
            updateStatus(chatData.feed?.[type] || `正在吃${action.name}...`);
            showNotification(chatData.notification?.feed || '吃饱了！', 'success');
            actionCount++;

            setTimeout(() => {
                checkAllDialogueTriggers();
            }, 2000);

            if (window.PointsSystem) {
                PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, 5);
            }
        }

        function actionPlay(type) {
            const action = eventData.play?.[type];
            if (!action) return;

            if (!consumeBackpackItem(action.consumeItem)) return;

            applyEffect(action.effect || {});
            updateStatus(chatData.play?.[type] || `正在${action.name}...`);
            showNotification(chatData.notification?.play || '玩得开心！', 'success');
            actionCount++;

            setTimeout(() => {
                checkAllDialogueTriggers();
            }, 2000);

            if (window.PointsSystem) {
                PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, 10);
            }
        }

        function updateStatus(text) {
            const el = document.getElementById('dialogContent');
            if (el) {
                el.textContent = text;
            }
        }

        function switchPanelTab(tabId) {
            document.querySelectorAll('.panel-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.sub-tab-content').forEach(content => content.style.display = 'none');

            const targetContent = document.getElementById('panel' + tabId);
            if (targetContent) {
                targetContent.style.display = 'block';
            }

            const buttons = document.querySelectorAll('.panel-tab');
            buttons.forEach(btn => {
                if (btn.textContent.includes(getPanelTabName(tabId))) {
                    btn.classList.add('active');
                }
            });
        }

        function getPanelTabName(tabId) {
            return chatData.tabs?.[tabId] || '';
        }

        function switchSubTab(tabId) {
            document.querySelectorAll('.sub-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.sub-tab-content').forEach(content => content.style.display = 'none');

            const targetContent = document.getElementById('subTab' + tabId);
            if (targetContent) {
                targetContent.style.display = 'block';
            }

            const buttons = document.querySelectorAll('.sub-tab');
            buttons.forEach(btn => {
                if (btn.textContent.includes(getSubTabName(tabId))) {
                    btn.classList.add('active');
                }
            });
        }

        function getSubTabName(tabId) {
            const names = { 'Clean': '清洗', 'Rest': '休息', 'Feed': '饮食', 'Play': '玩耍' };
            return names[tabId] || '';
        }

        function isItemExpired(itemInstance) {
            if (!itemInstance.expireTime) return false;
            return Date.now() > itemInstance.expireTime;
        }

        function isItemBroken(itemInstance) {
            if (itemInstance.durability === null || itemInstance.durability === undefined) return false;
            return itemInstance.durability <= 0;
        }

        function getDurabilityColor(durability) {
            if (durability >= 70) return '#4CAF50';
            if (durability >= 40) return '#FFC107';
            if (durability >= 20) return '#FF9800';
            return '#F44336';
        }

        function renderBackpack() {
            const grid = document.getElementById('backpackGrid');
            grid.innerHTML = '';

            const emptySlots = Math.max(0, backpack.capacity - backpack.items.length);

            backpack.items.forEach((itemInstance, index) => {
                const item = storeItems.find(i => i.id === itemInstance.id);
                if (!item) return;

                const expired = isItemExpired(itemInstance);
                const broken = isItemBroken(itemInstance);
                const canUse = !expired && !broken;

                const div = document.createElement('div');
                div.className = `backpack-item has-item ${expired ? 'expired' : ''} ${broken ? 'broken' : ''}`;

                let durabilityHtml = '';
                if (item.durability && itemInstance.durability !== null) {
                    const color = getDurabilityColor(itemInstance.durability);
                    durabilityHtml = `
                        <div class="item-durability">
                            <div class="durability-bar">
                                <div class="durability-fill" style="width: ${itemInstance.durability}%; background: ${color}"></div>
                            </div>
                        </div>
                    `;
                }

                let expireHtml = '';
                if (item.expireHours && itemInstance.expireTime) {
                    const remaining = Math.max(0, Math.ceil((itemInstance.expireTime - Date.now()) / 3600000));
                    expireHtml = `<span class="item-expire">${remaining}h</span>`;
                }

                div.innerHTML = `
                    <span class="item-icon">${expired ? '🧟' : broken ? '💔' : item.icon}</span>
                    <span class="item-name">${item.name}</span>
                    ${durabilityHtml}
                    ${expireHtml}
                `;

                if (canUse) {
                    div.onclick = () => useItem(index);
                } else {
                    div.title = expired ? '已过期' : '已损坏';
                }

                grid.appendChild(div);
            });

            for (let i = 0; i < emptySlots; i++) {
                const div = document.createElement('div');
                div.className = 'backpack-item';
                div.innerHTML = '<span style="opacity: 0.3;">📦</span>';
                grid.appendChild(div);
            }
        }

        function useItem(index) {
            const itemInstance = backpack.items[index];
            const item = storeItems.find(i => i.id === itemInstance.id);
            if (!item) return;

            if (isItemExpired(itemInstance)) {
                showNotification(`${item.name}已过期，无法使用！`, 'error');
                return;
            }

            if (isItemBroken(itemInstance)) {
                showNotification(`${item.name}已损坏，无法使用！`, 'error');
                return;
            }

            applyEffect(item.effect);

            if (item.durability && item.durability > 0) {
                itemInstance.durability = (itemInstance.durability || item.durability) - item.durabilityDrop;
                if (itemInstance.durability <= 0) {
                    showNotification(`${item.name}坏掉了...`, 'error');
                }
            }

            if (!item.durability || item.durability <= 0) {
                backpack.items.splice(index, 1);
            }

            saveBackpack();
            renderBackpack();
            showNotification(`${chatData.notification?.useItem || '使用了'}${item.name}`, 'success');
        }

        function actionGame(type) {
            const game = eventData.games?.[type];
            if (!game) return;

            if (!consumeBackpackItem(game.consumeItem)) return;

            updateStatus(`正在玩${game.name}...`);
            applyEffect(game.effect);
            actionCount++;

            if (game.reward && game.reward.points && window.PointsSystem) {
                PointsSystem.addPoints(PointsSystem.GAME_KEYS.OC, game.reward.points);
            }

            setTimeout(() => {
                showNotification(`玩${game.name}真开心！`, 'success');
                checkAllDialogueTriggers();
            }, 1000);

            if (game.gameUrl) {
                setTimeout(() => {
                    window.open(game.gameUrl, '_blank');
                }, 500);
            }
        }

        function renderStore(filter) {
            const grid = document.getElementById('storeGrid');
            grid.innerHTML = '';

            const filteredItems = filter === 'all' ? storeItems : storeItems.filter(item => item.type === filter);

            filteredItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'store-item';
                const canAfford = window.PointsSystem ? PointsSystem.hasEnoughPoints(item.price) : false;
                div.innerHTML = `
                    <span class="item-icon">${item.icon}</span>
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.desc}</div>
                    <div class="item-price">
                        <span>🏆</span>
                        <span>${item.price}</span>
                    </div>
                    <button class="buy-btn ${canAfford ? '' : 'disabled'}" onclick="buyItem('${item.id}')">购买</button>
                `;
                grid.appendChild(div);
            });
        }

        function switchStoreTab(type) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            currentStoreFilter = type;
            renderStore(type);
        }

        function buyItem(itemId) {
            const item = storeItems.find(i => i.id === itemId);
            if (!item) return;

            if (item.type === 'upgrade' && item.upgradeType === 'backpack') {
                if (window.PointsSystem) {
                    if (PointsSystem.hasEnoughPoints(item.price)) {
                        PointsSystem.spendPoints(item.price);
                        backpack.capacity += item.upgradeValue;
                        saveBackpack();
                        renderBackpack();
                        renderStore(currentStoreFilter);
                        showNotification(`背包扩容成功！当前容量：${backpack.capacity}`, 'success');
                    } else {
                        showNotification(chatData.notification?.buyFail || '积分不足！', 'error');
                    }
                } else {
                    showNotification(chatData.notification?.noPointsSystem || '积分系统未加载', 'error');
                }
                return;
            }

            if (backpack.items.length >= backpack.capacity) {
                showNotification('背包已满！请扩容或使用物品后再购买', 'error');
                return;
            }

            if (window.PointsSystem) {
                if (PointsSystem.hasEnoughPoints(item.price)) {
                    PointsSystem.spendPoints(item.price);

                    const newItem = {
                        id: item.id,
                        durability: item.durability || null,
                        expireTime: item.expireHours ? Date.now() + item.expireHours * 3600000 : null
                    };

                    backpack.items.push(newItem);
                    saveBackpack();
                    renderBackpack();
                    renderStore(currentStoreFilter);
                    showNotification(`${chatData.notification?.buySuccess || '购买成功！获得'}${item.name}`, 'success');
                } else {
                    showNotification(chatData.notification?.buyFail || '积分不足！', 'error');
                }
            } else {
                showNotification(chatData.notification?.noPointsSystem || '积分系统未加载', 'error');
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = type === 'success' ? '✅ ' : '❌ ';
            notification.textContent += message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100px)';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function toggleCollapse(collapseId) {
            const collapse = document.getElementById(collapseId);
            if (collapse) {
                collapse.classList.toggle('show');
            }
        }
    </script>
