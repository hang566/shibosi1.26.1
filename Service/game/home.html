<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>游戏中心 - 市舶司</title>

    <link href="../../ui/css/modules/base.css" rel="stylesheet">
    <link href="../../ui/css/modules/display.css" rel="stylesheet">
    <link href="../../ui/css/modules/feedback.css" rel="stylesheet">

    <link href="../../ui/css/modules/layout.css" rel="stylesheet">

    <style>
        body {
            padding-top: 60px;
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .game-card .game-cover {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, var(--main), #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .game-card .game-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            100% {
                left: 100%;
            }
        }

        .game-card .game-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-card .game-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .game-card .game-desc {
            font-size: 0.9rem;
            color: var(--text);
            opacity: 0.7;
            flex: 1;
            line-height: 1.5;
        }

        .game-card .game-tag {
            display: inline-block;
            padding: 4px 10px;
            background: var(--block-bg);
            border-radius: 12px;
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 8px;
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .points-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .points-display b {
            color: var(--main);
            font-size: 1.1rem;
        }

        .header-section {
            text-align: center;
            margin: 30px 0;
        }

        .header-section h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .header-section p {
            opacity: 0.7;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-left span {
            color: var(--text);
            opacity: 0.6;
        }

        .navbar-left .navbar-current {
            font-weight: 500;
            opacity: 1;
        }

        .navbar-brand a {
            color: var(--main);
            text-decoration: none;
        }

        .navbar-brand a:hover {
            text-decoration: underline;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gacha-section {
            max-width: none;
            margin: 0;
            padding: 0;
        }

        .gacha-card {
            position: relative;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 24px;
            padding: 32px;
            overflow: hidden;
            text-decoration: none;
            display: block;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 215, 0, 0.1);
        }

        .gacha-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 215, 0, 0.1) 60deg, transparent 120deg, rgba(160, 90, 255, 0.1) 180deg, transparent 240deg, rgba(255, 215, 0, 0.1) 300deg, transparent 360deg);
            animation: rotate 15s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        .gacha-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.6), rgba(160, 90, 255, 0.6), rgba(255, 215, 0, 0.6));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .gacha-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 60px rgba(255, 215, 0, 0.2), 0 0 100px rgba(160, 90, 255, 0.1);
        }

        .gacha-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .gacha-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .gacha-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffd700, #ff9500, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 3s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes gradientText {
            100% {
                background-position: 200% center;
            }
        }

        .gacha-desc {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .gacha-price {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 1.1rem;
            color: #ffd700;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .gacha-price:hover {
            background: rgba(255, 215, 0, 0.25);
            transform: scale(1.05);
        }

        .gacha-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 4s ease-in-out infinite;
        }

        @keyframes shine {

            0%,
            100% {
                left: -100%;
            }

            50% {
                left: 150%;
            }
        }

        .gacha-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .gacha-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            animation: particleFloat 8s ease-in-out infinite;
            opacity: 0;
        }

        .gacha-particle:nth-child(1) {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }

        .gacha-particle:nth-child(2) {
            top: 30%;
            right: 25%;
            animation-delay: 1s;
        }

        .gacha-particle:nth-child(3) {
            top: 50%;
            left: 15%;
            animation-delay: 2s;
        }

        .gacha-particle:nth-child(4) {
            top: 60%;
            right: 20%;
            animation-delay: 3s;
        }

        .gacha-particle:nth-child(5) {
            top: 75%;
            left: 30%;
            animation-delay: 4s;
        }

        .gacha-particle:nth-child(6) {
            top: 40%;
            right: 35%;
            animation-delay: 5s;
        }

        .gacha-particle:nth-child(7) {
            top: 85%;
            right: 15%;
            animation-delay: 6s;
        }

        .gacha-particle:nth-child(8) {
            top: 15%;
            left: 50%;
            animation-delay: 7s;
        }

        @keyframes particleFloat {

            0%,
            100% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        .oc-section {
            max-width: none;
            margin: 0;
            padding: 0;
        }

        .oc-card {
            position: relative;
            background: linear-gradient(145deg, #2d1b4e 0%, #1e1b4b 50%, #0f172a 100%);
            border-radius: 24px;
            padding: 32px;
            overflow: hidden;
            text-decoration: none;
            display: block;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 40px rgba(139, 92, 246, 0.15);
        }

        .oc-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(139, 92, 246, 0.12) 60deg, transparent 120deg, rgba(236, 72, 153, 0.12) 180deg, transparent 240deg, rgba(139, 92, 246, 0.12) 300deg, transparent 360deg);
            animation: rotate 12s linear infinite;
            pointer-events: none;
        }

        .oc-card::after {

        }

        .oc-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 60px rgba(139, 92, 246, 0.25), 0 0 100px rgba(236, 72, 153, 0.15);
        }

        .oc-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .oc-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.6));
        }

        .oc-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #ec4899, #a78bfa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 3s linear infinite;
            margin-bottom: 8px;
        }

        .oc-desc {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .oc-price {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 1.1rem;
            color: #a78bfa;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .oc-price:hover {
            background: rgba(139, 92, 246, 0.25);
            transform: scale(1.05);
        }

        .oc-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            animation: shine 4s ease-in-out infinite;
        }

        .oc-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .oc-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #a78bfa;
            border-radius: 50%;
            animation: particleFloat 8s ease-in-out infinite;
            opacity: 0;
        }

        .oc-particle:nth-child(1) { top: 20%; left: 20%; animation-delay: 0s; }
        .oc-particle:nth-child(2) { top: 30%; right: 25%; animation-delay: 1s; }
        .oc-particle:nth-child(3) { top: 50%; left: 15%; animation-delay: 2s; }
        .oc-particle:nth-child(4) { top: 60%; right: 20%; animation-delay: 3s; }
        .oc-particle:nth-child(5) { top: 75%; left: 30%; animation-delay: 4s; }
        .oc-particle:nth-child(6) { top: 40%; right: 35%; animation-delay: 5s; }
        .oc-particle:nth-child(7) { top: 85%; right: 15%; animation-delay: 6s; }
        .oc-particle:nth-child(8) { top: 15%; left: 50%; animation-delay: 7s; }

        @media (max-width: 768px) {
            .game-container {
                grid-template-columns: 1fr;
                padding: 0 16px;
            }

            .header-section h1 {
                font-size: 1.5rem;
            }

            .gacha-card {

            }

            .gacha-title {
                font-size: 1.5rem;
            }

            .gacha-icon {
                font-size: 48px;
            }

            .oc-card {
                padding: 24px;
            }

            .oc-title {
                font-size: 1.5rem;
            }

            .oc-icon {
                font-size: 48px;
            }
        }
    </style>
</head>

    <script>
        function toggleNavbar() {
            const navbarNav = document.getElementById('navbar-nav');
            const navbarToggle = document.getElementById('navbar-toggle');
            const isActive = navbarNav.classList.toggle('active');
            navbarToggle.classList.toggle('active');
            navbarToggle.setAttribute('aria-expanded', isActive);
        }

        function closeNavbar() {
            const navbarNav = document.getElementById('navbar-nav');
            const navbarToggle = document.getElementById('navbar-toggle');
            navbarNav.classList.remove('active');
            navbarToggle.classList.remove('active');
            navbarToggle.setAttribute('aria-expanded', 'false');
        }

        function updatePointsDisplay() {
            const pointsElement = document.getElementById('points');
            if (pointsElement && window.PointsSystem) {
                PointsSystem.loadPoints();
                const total = PointsSystem.getTotalPoints();
                pointsElement.textContent = '🏆 ' + total + ' 积分';
            }
        }

        document.addEventListener('click', function(e) {
            const navbar = document.querySelector('.navbar');
            if (!navbar.contains(e.target)) {
                closeNavbar();
            }
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                closeNavbar();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            updatePointsDisplay();
            if (window.PointsSystem) {
                PointsSystem.onUpdate(updatePointsDisplay);
            }
        });
    </script>
