version: '3.8'

services:
  # ============================================
  # Nginx 反向代理 & 负载均衡
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: shibosi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - admin-core-1
      - admin-core-2
    networks:
      - shibosi-net

  # ============================================
  # Go管理后台服务 (水平扩展: 2实例)
  # ============================================
  admin-core-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shibosi-admin-core-1
    restart: unless-stopped
    environment:
      - SHIBOSI_SERVER_PORT=8080
      - SHIBOSI_SERVER_MODE=release
      - SHIBOSI_DATABASE_DRIVER=mysql
      - SHIBOSI_DATABASE_HOST=mysql-master
      - SHIBOSI_DATABASE_PORT=3306
      - SHIBOSI_DATABASE_USER=shibosi
      - SHIBOSI_DATABASE_PASSWORD=${DB_PASSWORD:-shibosi_secret_2024}
      - SHIBOSI_DATABASE_DBNAME=shibosi
      - SHIBOSI_DATABASE_MAX_OPEN_CONNS=100
      - SHIBOSI_DATABASE_MAX_IDLE_CONNS=10
      - SHIBOSI_REDIS_HOST=redis
      - SHIBOSI_REDIS_PORT=6379
      - SHIBOSI_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SHIBOSI_JWT_SECRET=${JWT_SECRET:-shibosi_jwt_secret_change_me}
      - SHIBOSI_SECURITY_BCRYPT_COST=12
      - SHIBOSI_SECURITY_RATE_LIMIT_QPS=100
      - SHIBOSI_SECURITY_CORS_ORIGINS=*
      - SHIBOSI_SECURITY_ENABLE_TLS=false
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shibosi-net

  admin-core-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shibosi-admin-core-2
    restart: unless-stopped
    environment:
      - SHIBOSI_SERVER_PORT=8080
      - SHIBOSI_SERVER_MODE=release
      - SHIBOSI_DATABASE_DRIVER=mysql
      - SHIBOSI_DATABASE_HOST=mysql-master
      - SHIBOSI_DATABASE_PORT=3306
      - SHIBOSI_DATABASE_USER=shibosi
      - SHIBOSI_DATABASE_PASSWORD=${DB_PASSWORD:-shibosi_secret_2024}
      - SHIBOSI_DATABASE_DBNAME=shibosi
      - SHIBOSI_REDIS_HOST=redis
      - SHIBOSI_REDIS_PORT=6379
      - SHIBOSI_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SHIBOSI_JWT_SECRET=${JWT_SECRET:-shibosi_jwt_secret_change_me}
      - SHIBOSI_SECURITY_BCRYPT_COST=12
      - SHIBOSI_SECURITY_CORS_ORIGINS=*
      - SHIBOSI_SECURITY_ENABLE_TLS=false
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shibosi-net

  # ============================================
  # MySQL 主库
  # ============================================
  mysql-master:
    image: mysql:8.0
    container_name: shibosi-mysql-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: shibosi
      MYSQL_USER: shibosi
      MYSQL_PASSWORD: ${DB_PASSWORD:-shibosi_secret_2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./sql/migration.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "shibosi", "-p${DB_PASSWORD:-shibosi_secret_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shibosi-net

  # MySQL 从库 (读写分离)
  mysql-slave:
    image: mysql:8.0
    container_name: shibosi-mysql-slave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: shibosi
      MYSQL_USER: shibosi
      MYSQL_PASSWORD: ${DB_PASSWORD:-shibosi_secret_2024}
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --read-only=1
    networks:
      - shibosi-net

  # ============================================
  # Redis 主库 (缓存)
  # ============================================
  redis:
    image: redis:7.4-alpine
    container_name: shibosi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shibosi-net

  # Redis 从库 (可选)
  redis-slave:
    image: redis:7.4-alpine
    container_name: shibosi-redis-slave
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: >
      redis-server
      --slaveof redis 6379
      --masterauth ${REDIS_PASSWORD:-}
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
    depends_on:
      - redis
    networks:
      - shibosi-net

  # ============================================
  # Prometheus 监控 (可选)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: shibosi-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - shibosi-net
    profiles:
      - monitoring

  # Grafana 可视化 (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: shibosi-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - shibosi-net
    profiles:
      - monitoring

networks:
  shibosi-net:
    driver: bridge

volumes:
  mysql-master-data:
  mysql-slave-data:
  redis-data:
  prometheus-data:
  grafana-data: