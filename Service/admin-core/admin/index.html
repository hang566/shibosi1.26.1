<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市舶司 - 万能管理后台</title>
<style>
:root {
  --bg: #f0f2f5;
  --sidebar-bg: #001529;
  --sidebar-width: 260px;
  --header-height: 60px;
  --primary: #1890ff;
  --success: #52c41a;
  --warning: #faad14;
  --danger: #ff4d4f;
  --card-bg: #fff;
  --text: #333;
  --text-secondary: #666;
  --border: #e8e8e8;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
}

[data-theme="dark"] {
  --bg: #141414;
  --sidebar-bg: #000;
  --card-bg: #1f1f1f;
  --text: #e0e0e0;
  --text-secondary: #999;
  --border: #333;
  --shadow: 0 2px 8px rgba(0,0,0,.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* 侧边栏 */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform .3s;
}
.sidebar-brand {
  padding: 20px 24px;
  font-size: 20px;
  font-weight: 700;
  border-bottom: 1px solid rgba(255,255,255,.1);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-brand .logo { width: 32px; height: 32px; background: var(--primary); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
.sidebar-group-title {
  padding: 12px 24px 6px;
  font-size: 12px;
  color: rgba(255,255,255,.45);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}
.nav-item { 
  display: flex; align-items: center; gap: 10px; 
  padding: 12px 24px; color: rgba(255,255,255,.65); 
  cursor: pointer; transition: all .2s; font-size: 14px; 
  border-left: 3px solid transparent; 
}
.nav-item:hover { color: #fff; background: rgba(255,255,255,.08); }
.nav-item.active { color: #fff; background: var(--primary); border-left-color: #fff; }
.nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
.sidebar-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; color: rgba(255,255,255,.3); }

/* 主内容区 */
.main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-height: 100vh; }

/* 顶栏 */
.header {
  height: var(--header-height);
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  position: sticky; top: 0; z-index: 50;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.menu-toggle { display: none; font-size: 20px; cursor: pointer; background: none; border: none; color: var(--text); padding: 4px; }
.header-right { display: flex; align-items: center; gap: 16px; }
.user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.theme-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.logout-btn { background: var(--danger); color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }

/* 内容区 */
.content { flex: 1; padding: 24px; }
.loading { text-align: center; padding: 48px; color: var(--text-secondary); }

/* 卡片 */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 24px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }

/* 统计卡片 */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  display: flex; align-items: center; gap: 16px;
}
.stat-icon { width: 54px; height: 54px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.stat-icon.blue { background: #e6f7ff; color: #1890ff; }
.stat-icon.green { background: #f6ffed; color: #52c41a; }
.stat-icon.orange { background: #fff7e6; color: #faad14; }
.stat-icon.red { background: #fff2f0; color: #ff4d4f; }
.stat-icon.purple { background: #f9f0ff; color: #722ed1; }
.stat-icon.cyan { background: #e6fffb; color: #13c2c2; }
.stat-value { font-size: 28px; font-weight: 700; }
.stat-label { font-size: 13px; color: var(--text-secondary); }

/* 表格 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
th { background: #fafafa; font-weight: 600; color: var(--text-secondary); }
[data-theme="dark"] th { background: #262626; }

/* 标签 */
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.tag-admin, .tag-danger { background: #fff2f0; color: #ff4d4f; }
.tag-user, .tag-primary { background: #e6f7ff; color: #1890ff; }
.tag-guest, .tag-default { background: #f5f5f5; color: #999; }
.tag-active, .tag-success { background: #f6ffed; color: #52c41a; }
.tag-disabled, .tag-warning { background: #fff7e6; color: #faad14; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
  font-size: 14px; transition: all .2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { opacity: .85; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* 表单 */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.form-input, .form-select {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 14px; background: var(--card-bg); color: var(--text);
  transition: border-color .2s;
}
.form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); }

/* 操作栏 */
.action-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

/* 分页 */
.pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
.pagination button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text); cursor: pointer; }

/* 弹窗 */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg); border-radius: var(--radius); padding: 24px;
  min-width: 420px; max-width: 90vw; box-shadow: 0 4px 16px rgba(0,0,0,.15);
}
.modal-header { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); }
.modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }

/* Toast */
.toast {
  position: fixed; top: 24px; right: 24px; z-index: 300;
  padding: 12px 24px; border-radius: 6px; color: #fff; font-size: 14px;
  transform: translateX(120%); transition: transform .3s;
}
.toast.show { transform: translateX(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--warning); }

/* 搜索栏 */
.search-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

/* 服务卡片 */
.service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.service-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  border-left: 4px solid var(--primary);
}
.service-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.service-icon { font-size: 32px; }
.service-name { font-size: 16px; font-weight: 600; }
.service-status { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.service-info { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
.service-info div { margin-bottom: 4px; }
.service-actions { display: flex; gap: 8px; }

/* 图表 */
.chart-container { padding: 16px 0; }
.chart-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.chart-bar-label { width: 120px; font-size: 13px; color: var(--text-secondary); }
.chart-bar-wrap { flex: 1; height: 24px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
.chart-bar { height: 100%; border-radius: 4px; transition: width .3s; }
.chart-bar-value { width: 60px; font-size: 13px; font-weight: 600; text-align: right; }

/* 日志样式 */
.log-debug { opacity: .7; }
.log-info { }
.log-warning { background: #fffbe6; }
.log-error { background: #fff2f0; }
.log-fatal { background: #ff4d4f; color: #fff; }

.error-msg { color: var(--danger); padding: 16px; }

/* 服务门户卡片 */
.portal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
.portal-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:24px 16px; text-align:center; cursor:pointer; transition:all .2s; box-shadow:var(--shadow); }
.portal-card:hover { transform:translateY(-4px); box-shadow:0 4px 16px rgba(0,0,0,.12); border-color:var(--primary); }
.portal-icon { font-size:40px; margin-bottom:12px; }
.portal-name { font-size:16px; font-weight:600; margin-bottom:6px; color:var(--text); }
.portal-desc { font-size:12px; color:var(--text-secondary); margin-bottom:8px; line-height:1.4; }
.portal-status { font-size:13px; font-weight:500; }
.portal-status.online { color:var(--success); }
.portal-status.offline { color:var(--danger); }
.portal-hint { font-size:11px; color:var(--primary); margin-top:6px; }

/* 服务卡片增强 */
.service-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
.service-card-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.service-icon { font-size:28px; }
.service-name { font-size:15px; font-weight:600; }
.service-status { font-size:13px; font-weight:500; margin-bottom:8px; }
.service-info { font-size:12px; color:var(--text-secondary); margin-bottom:12px; line-height:1.8; }
.service-actions { display:flex; gap:8px; flex-wrap:wrap; }
.service-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }

/* 响应式 */
@media (max-width: 950px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .menu-toggle { display: block; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .stats-row { grid-template-columns: 1fr; }
  .modal { min-width: auto; width: 95vw; }
  .search-bar { flex-direction: column; }
  .search-bar .form-input { width: 100%; }
}
</style>
</head>
<body>

<!-- 登录页（独立于 app.js，确保 100% 可登录） -->
<div id="loginPage" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;">
  <div class="card" style="width:380px;">
    <div class="card-title" style="text-align:center;font-size:20px;">市舶司管理后台</div>
    <div class="form-group"><label class="form-label">用户名</label><input class="form-input" id="loginUser" placeholder="admin" value="admin"></div>
    <div class="form-group"><label class="form-label">密码</label><input class="form-input" id="loginPass" type="password" placeholder="输入密码"></div>
    <button class="btn btn-primary" style="width:100%;" id="loginBtn">登 录</button>
    <div id="loginError" style="color:var(--danger);margin-top:12px;text-align:center;font-size:13px;"></div>
    <div style="margin-top:12px;text-align:center;font-size:12px;color:var(--text-secondary);">默认账号: admin / 密码: admin123</div>
  </div>
</div>

<script>
(function() {
  var API_BASE = '/api/v1';

  function doLogin() {
    var username = document.getElementById('loginUser').value.trim();
    var password = document.getElementById('loginPass').value.trim();
    var errEl = document.getElementById('loginError');
    var btn = document.getElementById('loginBtn');

    if (!username || !password) {
      errEl.textContent = '请输入用户名和密码';
      return;
    }

    btn.disabled = true;
    btn.textContent = '登录中...';
    errEl.textContent = '';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', API_BASE + '/auth/login', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 10000;

    xhr.onload = function() {
      btn.disabled = false;
      btn.textContent = '登 录';
      try {
        var data = JSON.parse(xhr.responseText);
        if (data.code === 0 && data.data && data.data.access_token) {
          localStorage.setItem('admin_token', data.data.access_token);
          if (data.data.refresh_token) {
            localStorage.setItem('admin_refresh', data.data.refresh_token);
          }
          location.reload();
        } else {
          errEl.textContent = data.msg || '登录失败';
        }
      } catch(e) {
        errEl.textContent = '服务器响应错误';
      }
    };

    xhr.onerror = function() {
      btn.disabled = false;
      btn.textContent = '登 录';
      errEl.textContent = '网络错误，请检查服务是否启动';
    };

    xhr.ontimeout = function() {
      btn.disabled = false;
      btn.textContent = '登 录';
      errEl.textContent = '请求超时';
    };

    xhr.send(JSON.stringify({ username: username, password: password }));
  }

  document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('loginBtn');
    if (btn) {
      btn.addEventListener('click', doLogin);
    }
    var pass = document.getElementById('loginPass');
    if (pass) {
      pass.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          doLogin();
        }
      });
    }
  });

  // 如果已有 token，隐藏登录页
  if (localStorage.getItem('admin_token')) {
    var loginPage = document.getElementById('loginPage');
    if (loginPage) loginPage.style.display = 'none';
  }
})();
</script>

<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="logo">S</div>
    <span>市舶司管理后台</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <!-- 动态生成 -->
  </nav>
  <div class="sidebar-footer">市舶司 v3.0 | 万能管理后台</div>
</aside>

<!-- 主内容区 -->
<div class="main">
  <!-- 顶栏 -->
  <header class="header">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <span id="pageTitle">加载中...</span>
    </div>
    <div class="header-right">
      <button class="theme-btn" id="themeToggle">🌓 主题</button>
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">A</div>
        <span id="userName">管理员</span>
      </div>
      <button class="logout-btn" id="logoutBtn">退出</button>
    </div>
  </header>

  <!-- 内容区 -->
  <div class="content" id="contentArea">
    <!-- 动态渲染 -->
  </div>
</div>

<!-- Toast通知 -->
<div class="toast" id="toast"></div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- 万能管理后台引擎 -->
<script src="app-v2.js?v=20260731i"></script>
